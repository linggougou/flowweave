<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowWeave Toast 二次确认 Fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui,
          sans-serif;
        --bg: #f0f5fb;
        --panel: #fcfdff;
        --border: #ccdae9;
        --text: #24354c;
        --muted: #667991;
        --accent: #2b6cb0;
        --accent-soft: rgba(43, 108, 176, 0.12);
        --success: #1f5d47;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(43, 108, 176, 0.14), transparent 30%),
          linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 20px 120px;
      }

      .hero,
      .shell,
      .result,
      .toast {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(36, 53, 76, 0.08);
      }

      .hero,
      .shell,
      .result {
        padding: 24px;
      }

      .hero {
        margin-bottom: 20px;
      }

      .result {
        margin-top: 18px;
      }

      .result[hidden],
      .toast[hidden] {
        display: none;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      .meta div {
        padding: 16px;
        border-radius: 18px;
        background: rgba(43, 108, 176, 0.08);
      }

      .meta strong {
        display: block;
        color: var(--muted);
        margin-bottom: 6px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #open-popconfirm {
        background: var(--accent);
        color: #fff;
      }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: min(100vw - 40px, 380px);
        padding: 18px 18px 16px;
      }

      .toast-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
      }

      .ghost {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .solid {
        background: var(--accent);
        color: #fff;
      }

      .solid:disabled,
      .ghost:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #toast-status {
        min-height: 24px;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        main {
          padding-inline: 14px;
        }

        .toast {
          right: 12px;
          left: 12px;
          bottom: 12px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p>Fixture 目标：验证轻量 toast 二次确认、确认后消失、结果区稳定回显。</p>
        <h1 id="page-title">发布申请清单</h1>
        <p>
          推荐后续自动化步骤：点击提交审核、等待轻量确认 toast 可见、点击确认、等待 toast 消失，再断言结果成功态。
        </p>
      </section>

      <section class="shell" aria-labelledby="task-title">
        <p id="task-badge">当前记录：待提交审批</p>
        <h2 id="task-title">FW-TOAST-118 | 周报发布申请</h2>
        <p id="task-copy">该条记录使用轻量确认，不再弹出全屏 Modal。</p>
        <button id="open-popconfirm" type="button">提交审核</button>

        <section
          id="toast-result"
          class="result"
          hidden
          data-ready="false"
          aria-labelledby="result-title"
        >
          <h3 id="result-title">提交结果</h3>
          <div class="meta">
            <div>
              <strong>状态</strong>
              <span id="result-state">未提交</span>
            </div>
            <div>
              <strong>处理人</strong>
              <span id="result-owner">-</span>
            </div>
            <div>
              <strong>结果摘要</strong>
              <span id="result-summary">-</span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <section
      id="toast-popconfirm"
      class="toast"
      hidden
      data-ready="false"
      aria-live="polite"
    >
      <strong id="toast-title">确认提交审核？</strong>
      <p id="toast-copy">提交后将推送给排班负责人，建议先确认附件已齐全。</p>
      <p id="toast-status">等待确认。</p>
      <div class="toast-actions">
        <button id="toast-cancel" type="button" class="ghost">取消</button>
        <button id="toast-confirm" type="button" class="solid">确认提交</button>
      </div>
    </section>

    <script>
      const openButton = document.getElementById("open-popconfirm");
      const taskBadge = document.getElementById("task-badge");
      const toast = document.getElementById("toast-popconfirm");
      const toastStatus = document.getElementById("toast-status");
      const cancelButton = document.getElementById("toast-cancel");
      const confirmButton = document.getElementById("toast-confirm");
      const result = document.getElementById("toast-result");
      const resultState = document.getElementById("result-state");
      const resultOwner = document.getElementById("result-owner");
      const resultSummary = document.getElementById("result-summary");

      function closeToast() {
        toast.hidden = true;
        toast.dataset.ready = "false";
        toastStatus.textContent = "等待确认。";
        confirmButton.disabled = false;
        cancelButton.disabled = false;
      }

      openButton.addEventListener("click", () => {
        toast.hidden = false;
        toast.dataset.ready = "true";
        taskBadge.textContent = "轻量确认已弹出";
      });

      cancelButton.addEventListener("click", () => {
        closeToast();
        taskBadge.textContent = "已取消提交审核";
      });

      confirmButton.addEventListener("click", () => {
        if (confirmButton.disabled) {
          return;
        }

        confirmButton.disabled = true;
        cancelButton.disabled = true;
        toastStatus.textContent = "正在提交审核...";

        window.setTimeout(() => {
          closeToast();
          result.hidden = false;
          result.dataset.ready = "true";
          taskBadge.textContent = "审核提交流程已完成";
          resultState.textContent = "已提交";
          resultOwner.textContent = "排班负责人：林渡";
          resultSummary.textContent = "已通过轻量确认并加入审核队列";
        }, 640);
      });
    </script>
  </body>
</html>
