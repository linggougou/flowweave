<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowWeave 会话失效仪表盘 Fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui,
          sans-serif;
        --bg: #f5f3ef;
        --panel: rgba(255, 253, 249, 0.96);
        --border: #d5cab8;
        --text: #2f271d;
        --muted: #6b614f;
        --warning: #9f4d21;
        --warning-soft: rgba(159, 77, 33, 0.12);
        --accent: #375f8c;
        --accent-soft: rgba(55, 95, 140, 0.12);
        --success: #245b45;
        --success-soft: rgba(36, 91, 69, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top right, rgba(159, 77, 33, 0.14), transparent 30%),
          linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 40px 20px 72px;
      }

      .hero,
      .shell,
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 46px rgba(47, 39, 29, 0.08);
      }

      .hero,
      .shell,
      .panel {
        padding: 24px;
      }

      .hero {
        margin-bottom: 20px;
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
      }

      #session-state[data-tone="warning"] {
        background: var(--warning-soft);
        color: var(--warning);
      }

      #session-state[data-tone="success"] {
        background: var(--success-soft);
        color: var(--success);
      }

      .banner {
        margin-top: 18px;
        padding: 18px 20px;
        border-radius: 20px;
        background: var(--warning-soft);
      }

      .banner[hidden],
      .panel[hidden],
      .loading[hidden] {
        display: none;
      }

      .banner strong,
      .panel strong {
        display: block;
        margin-bottom: 8px;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .ghost {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .loading {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 16px;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .panel {
        margin-top: 18px;
      }

      .panel-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
        margin-top: 16px;
      }

      .metric {
        padding: 16px;
        border-radius: 18px;
        background: rgba(55, 95, 140, 0.08);
      }

      .metric span {
        display: block;
        margin-top: 6px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      #refresh-status {
        min-height: 24px;
        margin-top: 16px;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        main {
          padding-inline: 14px;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p>Fixture 目标：验证会话失效页、恢复动作、局部 loading 与恢复后后台面板重新可用。</p>
        <h1 id="page-title">渠道日报仪表盘</h1>
        <p>
          推荐后续自动化步骤：带失效会话打开页面、点击“恢复会话”、等待 loading 消失，再断言面板进入可用态。
        </p>
      </section>

      <section id="dashboard-shell" class="shell" data-loading="false">
        <div class="status-row">
          <span id="session-state" class="chip" data-tone="warning">会话已失效</span>
          <span id="last-user">最近登录：未知</span>
        </div>

        <section
          id="session-expired-banner"
          class="banner"
          data-state="expired"
          aria-labelledby="expired-title"
        >
          <strong id="expired-title">登录已过期</strong>
          <p id="expired-copy">
            当前页面检测到会话票据已失效，继续执行前需要刷新会话并重新拉取待办。
          </p>
          <div class="actions">
            <button id="refresh-session" type="button">恢复会话</button>
            <button id="dismiss-banner" type="button" class="ghost">稍后处理</button>
          </div>
        </section>

        <div id="session-refreshing" class="loading" hidden aria-live="polite">
          正在恢复会话并重新同步仪表盘...
        </div>

        <p id="refresh-status">等待处理会话失效告警。</p>

        <section
          id="dashboard-panel"
          class="panel"
          hidden
          data-ready="false"
          aria-labelledby="dashboard-title"
        >
          <strong id="dashboard-title">日报面板已恢复</strong>
          <p id="session-user">当前登录：未恢复</p>
          <div class="panel-grid">
            <div class="metric">
              待处理队列
              <span id="queue-count">0</span>
            </div>
            <div class="metric">
              当前负责人
              <span id="queue-owner">未分配</span>
            </div>
            <div class="metric">
              恢复结果
              <span id="refresh-result">尚未执行</span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script>
      const shell = document.getElementById("dashboard-shell");
      const sessionState = document.getElementById("session-state");
      const lastUser = document.getElementById("last-user");
      const expiredBanner = document.getElementById("session-expired-banner");
      const refreshButton = document.getElementById("refresh-session");
      const dismissButton = document.getElementById("dismiss-banner");
      const refreshing = document.getElementById("session-refreshing");
      const refreshStatus = document.getElementById("refresh-status");
      const dashboardPanel = document.getElementById("dashboard-panel");
      const sessionUser = document.getElementById("session-user");
      const queueCount = document.getElementById("queue-count");
      const queueOwner = document.getElementById("queue-owner");
      const refreshResult = document.getElementById("refresh-result");

      const session = window.localStorage.getItem("flowweave:session-user") || "未知同学";
      const sessionStatus = window.localStorage.getItem("flowweave:session-status") || "expired";

      lastUser.textContent = `最近登录：${session}`;
      if (sessionStatus !== "expired") {
        sessionState.textContent = "会话可用";
        sessionState.dataset.tone = "success";
        expiredBanner.hidden = true;
      }

      dismissButton.addEventListener("click", () => {
        refreshStatus.textContent = "已忽略本次提醒，等待人工稍后重试。";
      });

      refreshButton.addEventListener("click", () => {
        if (shell.dataset.loading === "true") {
          return;
        }

        shell.dataset.loading = "true";
        shell.setAttribute("aria-busy", "true");
        refreshButton.disabled = true;
        refreshing.hidden = false;
        refreshStatus.textContent = "正在恢复会话...";

        window.setTimeout(() => {
          window.localStorage.setItem("flowweave:session-status", "active");
          shell.dataset.loading = "false";
          shell.removeAttribute("aria-busy");
          refreshing.hidden = true;
          expiredBanner.hidden = true;
          expiredBanner.dataset.state = "resolved";
          sessionState.textContent = "会话已恢复";
          sessionState.dataset.tone = "success";
          refreshStatus.textContent = "会话已恢复，仪表盘重新可用。";
          dashboardPanel.hidden = false;
          dashboardPanel.dataset.ready = "true";
          sessionUser.textContent = `当前登录：${session}`;
          queueCount.textContent = "12";
          queueOwner.textContent = session;
          refreshResult.textContent = "已重新拉取日报待办";
        }, 820);
      });
    </script>
  </body>
</html>
