<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowWeave 录制</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      body {
        margin: 0;
        padding: 16px;
        min-width: 280px;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 0.8125rem;
        color: #475569;
        margin-bottom: 4px;
      }
      select,
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 0.875rem;
      }
      .stat {
        font-size: 2rem;
        font-weight: 700;
        margin: 8px 0 4px;
      }
      .meta {
        color: #64748b;
        font-size: 0.8125rem;
        margin-bottom: 16px;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 0.9375rem;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.secondary {
        background: #0f766e;
      }
      button.ghost {
        background: #e2e8f0;
        color: #0f172a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        filter: brightness(0.95);
      }
      .status {
        margin-top: 12px;
        font-size: 0.8125rem;
        color: #475569;
        min-height: 1.25rem;
      }
      .hint {
        font-size: 0.75rem;
        color: #64748b;
        margin: 0 0 12px;
      }
      .session-status {
        display: inline-block;
        margin: 4px 0 8px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .controls button {
        margin-bottom: 0;
      }
      .preview {
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
      }
      .preview h2 {
        margin: 0 0 8px;
        font-size: 0.9375rem;
      }
      .preview ol {
        margin: 8px 0;
        padding-left: 1.25rem;
        font-size: 0.8125rem;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>FlowWeave 录制</h1>
    <p class="hint">请保持织流 Studio 打开</p>
    <label for="project-select">目标项目</label>
    <select id="project-select">
      <option value="">加载项目中…</option>
    </select>
    <button type="button" id="refresh-projects-btn" class="ghost">刷新项目列表</button>
    <p class="hint" id="recording-page">正在检测当前页…</p>
    <button type="button" id="reload-page-btn" class="ghost">刷新当前页以启用录制</button>
    <p class="session-status" id="recording-status">尚未开始</p>
    <div class="controls" aria-label="录制控制">
      <button type="button" id="start-btn">开始录制</button>
      <button type="button" id="pause-btn" class="ghost" hidden>暂停录制</button>
      <button type="button" id="resume-btn" hidden>继续录制</button>
      <button type="button" id="complete-btn" class="secondary" hidden>完成录制</button>
    </div>
    <p>已记录事件</p>
    <p class="stat" id="event-count">0</p>
    <p class="meta" id="session-meta">会话加载中…</p>
    <section class="preview" id="completion-preview" hidden>
      <h2>录制预览</h2>
      <p class="hint" id="target-sites">目标站点：待识别</p>
      <ol id="step-preview"></ol>
      <label for="task-name">任务名称</label>
      <input id="task-name" maxlength="80" autocomplete="off" placeholder="例如：每天导出订单" />
    </section>
    <button type="button" id="sync-btn" class="secondary" disabled>
      确认名称并保存到 Studio
    </button>
    <button type="button" id="export-btn" disabled>导出 Flow JSON</button>
    <button type="button" id="clear-btn" class="ghost">清空录制</button>
    <button type="button" id="restore-btn" class="ghost" hidden>恢复刚才的录制</button>
    <p class="status" id="status" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
